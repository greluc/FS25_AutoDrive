name: Check

# Compiles every Lua file and runs the unit test suites.
#
# The compile step is the important half: it uses the same Luau dialect the game runs, so a syntax
# error that Lua 5.4 would accept (or reject differently) cannot slip through. When no working Luau
# compiler is available the check falls back to luac -p and says so rather than passing quietly.

on:
  push:
    branches: [main]
  pull_request:

env:
  # luau-lang/luau release to compile against. Bump deliberately: an unpinned "latest" makes a green
  # build depend on what was published this morning.
  LUAU_VERSION: "0.734"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Cache the Luau compiler
        id: cache-luau
        uses: actions/cache@v6
        with:
          path: tools/bin/luau-compile
          key: luau-compile-${{ env.LUAU_VERSION }}-ubuntu

      # The official compiler, not a wrapper around one. The previous arrangement built
      # fs-luau-compile from source, and that binary shells out to a luau-compile the runner does not
      # have - so the step reported all 128 files as broken while every source was fine.
      - name: Install the Luau compiler
        if: steps.cache-luau.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p tools/bin
          curl -fsSL -o luau.zip \
            "https://github.com/luau-lang/luau/releases/download/${LUAU_VERSION}/luau-ubuntu.zip"
          unzip -j -o luau.zip luau-compile -d tools/bin
          chmod +x tools/bin/luau-compile

      - name: Show which compiler will be used
        run: tools/bin/luau-compile --version || tools/bin/luau-compile --help | head -3

      - name: Run checks
        run: python3 tools/check.py -v
